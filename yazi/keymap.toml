[mgr]
prepend_keymap = [
    {
        on = "<A-w>",
        run = "quit",
        desc = "Single aciton with `Ctrl + a`"
    },

    # does not work properly
    {
        on = "<C-z>",
        run = "suspend",
        desc = "Suspend the process"
    },

    ## Hopping
    {
        on = ["g", "g"],
        run = "arrow top", 
        desc = "Go to top"
    },

    {
        on = ["g", "w"],
        run = "cd ~/Documents/Work", 
        desc = "Go to Work"
    },


    {
        on = ["g", "P"],
        run = "cd ~/Pictures", 
        desc = "Go to Pictures"
    },
    
    { 
        on = ["g", "v"],
        run = "cd ~/Videos",
        desc = "Go to Videos"
    },

    { 
        on = ["g", "m"],
        run = "cd ~/Music",
        desc = "Go to Music"
    },

    { 
        on = ["g", "D"],
        run = "cd ~/Documents",
        desc = "Go to Documents"
    },


    {
        on = "G",
        run = "arrow bot", 
        desc = "Go to bot"
    },
    
    # home dir
    {
        on = ["g", "h"],
        run = "cd ~", 
        desc = "Go to home dir"
    },
    # root dir
    {
        on = ["g", "/"],
        run = "cd /",
        desc = "Go to root dir"
    },
    # Personal
    {
        on = ["g", "p"],
        run = "cd ~/Documents/Personal", 
        desc = "Go to Personal dir"
    },
     # Books 
    {
        on = ["g", "b"],
        run = "cd ~/Books", 
        desc = "Swallaow some knowledge"
    },
    # Downloads
    {
        on = ["g", "d"],
        run = "cd ~/Downloads", 
        desc = "Go to Downloads"
    },

    {
        on = ["o", "o"],
        run = 'shell --orphan "kitty"',
        desc = "open a new Terminal in current dir"
    },
    # Leistungskurse
    {
        on = ["g", "l"],
        run = "cd ~/Documents/DHBW/Leistungskurse", 
        desc = "Go to Leistungskurse"
    },
    
    {
        on = ["g", "."],
        run = "cd ~/.config/",
        desc = "The peak ricing can be continued"
    },


###### Navigaton ######
    {
        on = "j",
        run = "arrow next",
        desc = "Move down"
    },

    {
        on = "k",
        run = "arrow prev",
        desc = "Move up"
    },

    {
        on = "l",
        run = "enter",
        desc = "Enter child directory"
    },

    {
        on = "h",
        run = "back",
        desc = "Enter parent directory"
    },

    { 
        on = "u",
        run = "forward",
        desc = "Forward to next dir"
    },

    ###### Seeking ######
    {
        on = "K",
        run = "seek -5",
        desc = "Seek up 5 units in the preview"
    },

    {
        on = "J",
        run = "seek +5",
        desc = "Seek up 5 units in the preview"
    },
    
    ##### Spoting #####
    {
        on = "I",
        run = "spot",
        desc = "Detailed file information"
    },

    ##### toggle #####
    {
        on = "<Space>", 
        run = "toggle",
        desc = "toggle current item"
    },

    {
        on = "<A-Space>", 
        run = "toggle_all",
        desc = "toggle current item"
    },
    ##### visual mode #####
    {
        on = "v",
        run = "visual_mode",
        desc = "Enter visual mode"
    },

    ##### open #####
    {
        on = "o",
        run = "open",
        desc = "open the file"
    },

    {
        on = "O",
        run = "open --interactive",
        desc = "open the file"
    },

    ##### yank #####
    {
        on = "y",
        run = "yank",
        desc = "yank the selected"
    },

    {
        on = "<C-x>",
        run = "yank --cut",
        desc = "cut the selected"
    },

    {
        on = "X",
        run = "unyank",
        desc = "unYank"
    },

    {
        on = "Y",
        run = "unyank",
        desc = "unyank"
    },

    {
        on = "<C-v>",
        run = "paste",
        desc = "paste the selected"
    },

    {
        on = "p",
        run = "paste",
        desc = "paste the selected"
    },
    ##### deletion/creation #####
    {
        on = "d",
        run = "remove",
        desc = "remove the selected"
    },

    {
        on = "n",
        run = "create",
        desc = "create a new file/dir"
    },
    ##### rename #####
    {
        on = ["r", "r"],
        run = "rename --empty=stem --cursor=start",
        desc = "file-name rename"
    },

    {
        on = ["r", "e"],
        run = "rename --empty=ext --cursor=end",
        desc = "extenstion rename"
    },

    {
        on = ["r", "a"],
        run = "rename --empty=all --cursor=start",
        desc = "scratch/full rename"
    },


    ##### copy ######
    {
        on = ["c", "c"],
        run = "copy path",
        desc = "Copy file path"
    },

    {
        on = ["c", "d"],
        run = "copy dirname",
        desc = "Copy parentDirectory path"
    },

    {
        on = ["c", "f"],
        run = "copy filename",
        desc = "Copy filename path"
    },

    {
        on = ["c", "n"],
        run = "copy filename, without extension",
        desc = "Copy filename only"
    },

    ##### hidden #####
    {
        on = ".",
        run = "hidden toggle",
        desc = "Toggle the hidden state"
    },
     ##### Linemode/meta data #####

    { 
        on = ["m", "n"],
        run = "linemode none",
        desc = "Exit linemode"
    },
    
    { 
        on = ["m", "s"],
        run = "linemode size",
        desc = "Display size"
    },

    { 
        on = ["m", "b"],
        run = "linemode btime",
        desc = "Display birth_time"
    },

     { 
        on = ["m", "m"],
        run = "linemode mtime",
        desc = "Display last modified time"
    },

     { 
        on = ["m", "p"],
        run = "linemode permissions",
        desc = "Display file permissions"
    },

     { 
        on = ["m", "o"],
        run = "linemode owner",
        desc = "Display file owner"
    },
]

append_keymap = [
    {
        on = "A",
        run = "quit",
        desc = "Single aciton with `Ctrl + a`"
    },
]
